name: SukiSU latest + SUSFS 2.3.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
  push:
    branches:
      - 'android*'
    paths:
      - '.github/workflows/resukisu-latest-susfs230.yml'
      - '.github/scripts/adapt-susfs230.sh'
      - '.github/scripts/adapt-resukisu-sucompat230.sh'
      - '.github/scripts/rewrite-susfs230-hooks.py'

jobs:
  build-kernel:
    name: SukiSU latest + SUSFS 2.3.0 (${{ github.event.inputs.device || 'alioth' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout successful SUSFS 2.3 kernel baseline
        uses: actions/checkout@v4
        with:
          ref: sukisu-selinux-hide-fix
          fetch-depth: 1

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: kernel-ccache-resukisu-latest-susfs230-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          tar -zxvf Clang-16.0.6-20260510.tar.gz

      - name: Apply Full SUSFS 2.3.0 & ReSukiSU Sucompat Alignment + Strict Verification
        run: |
          chmod +x .github/scripts/adapt-susfs230.sh \
                   .github/scripts/adapt-resukisu-sucompat230.sh \
                   .github/scripts/rewrite-susfs230-hooks.py

          echo "========================================="
          echo "Step 1: Running SUSFS 2.3.0 core adapter..."
          echo "========================================="
          .github/scripts/adapt-susfs230.sh

          echo "========================================="
          echo "Step 2: Rewriting 4.19 inline hooks..."
          echo "========================================="
          python3 -u .github/scripts/rewrite-susfs230-hooks.py

          echo "========================================="
          echo "Step 3: Aligning ReSukiSU sucompat handlers..."
          echo "========================================="
          .github/scripts/adapt-resukisu-sucompat230.sh

          echo "========================================="
          echo "Step 4: Running Strict Verification..."
          echo "========================================="
          
          FAILED=0

          # 1. 验证 SUSFS 版本
          if grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h; then
            echo "[OK] SUSFS v2.3.0 header verified."
          else
            echo "[ERROR] SUSFS v2.3.0 header not found!"
            FAILED=1
          fi

          # 2. 验证 exec.c 钩子
          if grep -Fq 'susfs_is_current_proc_no_su()' fs/exec.c; then
            echo "[OK] fs/exec.c hook verified."
          else
            echo "[ERROR] susfs_is_current_proc_no_su() missing in fs/exec.c!"
            FAILED=1
          fi

          # 3. 验证 open.c 钩子
          if grep -Fq 'filename_lookup(dfd, fname, lookup_flags, &path, NULL)' fs/open.c; then
            echo "[OK] fs/open.c hook verified."
          else
            echo "[ERROR] filename_lookup missing in fs/open.c!"
            FAILED=1
          fi

          # 4. 验证 sucompat 对齐情况
          SUC_PATH=$(find . -name 'sucompat.c' | head -n1)
          if [ -n "$SUC_PATH" ] && grep -Fq 'int ksu_handle_faccessat(int *dfd, struct filename **filename' "$SUC_PATH"; then
            echo "[OK] ReSukiSU sucompat handlers aligned successfully."
          else
            echo "[ERROR] sucompat faccessat handler not properly aligned!"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "========================================="
            echo "Strict verification FAILED. Aborting compilation."
            echo "========================================="
            exit 1
          else
            echo "========================================="
            echo "All integration checks passed successfully."
            echo "========================================="
          fi

          echo 'KCFLAGS=-DMODULE_IMPORT_NS\(x\)= -DTWA_RESUME=1' >> "$GITHUB_ENV"

      - name: Modify kernel version string (Remove cip/st extra suffix)
        run: |
          sed -i 's|^EXTRAVERSION =.*|EXTRAVERSION = -Ikun-KirinNova|' Makefile
          
          find arch/arm64/configs -maxdepth 1 -type f -name "*defconfig" | while read file
          do
            sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$file"
            echo 'CONFIG_LOCALVERSION_AUTO=n' >> "$file"
            sed -i '/CONFIG_LOCALVERSION=/d' "$file"
            echo 'CONFIG_LOCALVERSION=""' >> "$file"
          done
          
          echo '#!/bin/sh' > scripts/setlocalversion
          echo 'echo ""' >> scripts/setlocalversion
          chmod +x scripts/setlocalversion

      - name: Run proven build script
        env:
          INPUT_DEVICE: ${{ github.event.inputs.device }}
          INPUT_TARGET_OS: ${{ github.event.inputs.target_os }}
        run: |
          chmod +x build_kernel.sh
          DEVICE="${INPUT_DEVICE:-alioth}"
          TARGET_OS="${INPUT_TARGET_OS:-miui}"
          echo "Executing command: ./build_kernel.sh $DEVICE ksu $TARGET_OS"
          echo "KCFLAGS=$KCFLAGS"
          ./build_kernel.sh "$DEVICE" ksu "$TARGET_OS"
          
          echo 'resukisu_ref=main-latest' >> adapt-susfs230-proof.txt 

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APT-ReSukiSU-latest-SUSFS230-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_number }}
          path: |
            APTKernel_*.zip
            adapt-susfs230.log
            adapt-susfs230-proof.txt
          if-no-files-found: warn
