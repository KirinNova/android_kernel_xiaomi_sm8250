name: ReSukiSU latest + SUSFS 2.3.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
  push:
    branches:
      - 'android*'
    paths:
      - '.github/workflows/resukisu-latest-susfs230.yml'
      - '.github/scripts/adapt-susfs230.sh'
      - '.github/scripts/rewrite-susfs230-hooks.py'
      - '.github/scripts/adapt-resukisu-sucompat230.sh'
      - '.github/scripts/adapt-resukisu-latest-setup.py'

jobs:
  build-kernel:
    name: ReSukiSU latest + SUSFS 2.3.0 (${{ github.event.inputs.device || 'alioth' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout successful SUSFS 2.3 kernel baseline
      uses: actions/checkout@v4
      with:
        ref: sync-resukisu42-susfs230
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-resukisu-latest-susfs230-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Full SUSFS 2.3.0 backport (GKI overlay + 4.19 hooks)
      run: |
        chmod +x .github/scripts/adapt-susfs230.sh .github/scripts/adapt-resukisu-sucompat230.sh
        .github/scripts/adapt-susfs230.sh
        grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
        grep -Fq 'susfs_is_current_proc_no_su()' fs/exec.c
        grep -Fq 'filename_lookup(dfd, fname, lookup_flags, &path, NULL)' fs/open.c
        grep -Fq 'filename_lookup(dfd, fname, lookup_flags, &path, NULL)' fs/stat.c

    - name: Use latest ReSukiSU main
      run: |
        RESUKISU_SHA=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')
        if [ -z "$RESUKISU_SHA" ]; then
          echo 'failed to resolve ReSukiSU main SHA'
          exit 1
        fi
        echo "RESUKISU_SHA=$RESUKISU_SHA" >> "$GITHUB_ENV"
        echo "Resolved ReSukiSU main: $RESUKISU_SHA"
        python3 .github/scripts/adapt-resukisu-latest-setup.py "$RESUKISU_SHA"
        echo 'KCFLAGS=-DMODULE_IMPORT_NS\(x\)= -DTWA_RESUME=1' >> "$GITHUB_ENV"
        grep -nE 'ReSukiSU|adapt-resukisu|-d KPM' build_kernel.sh | head

    - name: Modify kernel version string (Remove cip/st extra suffix)
      run: |
        sed -i 's|^EXTRAVERSION =.*|EXTRAVERSION = -Ikun-KirinNova|' Makefile
        
        find arch/arm64/configs -maxdepth 1 -type f -name "*defconfig" | while read file
        do
          sed -i '/CONFIG_LOCALVERSION_AUTO/d' "$file"
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> "$file"
          sed -i '/CONFIG_LOCALVERSION=/d' "$file"
          echo 'CONFIG_LOCALVERSION=""' >> "$file"
        done
        
        echo '#!/bin/sh' > scripts/setlocalversion
        echo 'echo ""' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion

    - name: Run proven build script
      env:
        INPUT_DEVICE: ${{ github.event.inputs.device }}
        INPUT_TARGET_OS: ${{ github.event.inputs.target_os }}
      run: |
        chmod +x build_kernel.sh
        DEVICE="${INPUT_DEVICE:-alioth}"
        TARGET_OS="${INPUT_TARGET_OS:-miui}"
        echo "Executing command: ./build_kernel.sh $DEVICE ksu $TARGET_OS"
        echo "ReSukiSU SHA: ${RESUKISU_SHA:-unknown}"
        echo "KCFLAGS=$KCFLAGS"
        ./build_kernel.sh "$DEVICE" ksu "$TARGET_OS"
        grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
        echo "resukisu_sha=${RESUKISU_SHA:-unknown}" >> adapt-susfs230-proof.txt
        echo 'resukisu_ref=main-latest' >> adapt-susfs230-proof.txt

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: APT-ReSukiSU-latest-SUSFS230-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_number }}
        path: |
          APTKernel_*.zip
          adapt-susfs230.log
          adapt-susfs230-proof.txt
        if-no-files-found: warn
